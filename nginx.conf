# nginx config for the hotseaters-ultimate static bundle.
#
# Responsibilities:
#  1. SPA fallback — every non-asset path serves index.html so client-side
#     routing (react-router-dom v7) works on deep links / refresh.
#  2. Cross-origin isolation — PGlite uses SharedArrayBuffer / OPFS, which the
#     browser only enables when the document is cross-origin isolated. COOP +
#     COEP + CORP enable it.
#  3. Standard web security headers — HSTS, CSP, Referrer-Policy,
#     X-Content-Type-Options, Permissions-Policy.
#
# CSP design notes:
#   - `wasm-unsafe-eval` is REQUIRED for PGlite's WASM Postgres binary.
#   - `worker-src blob:` is required because Vite's web-worker plugin emits
#     blob: URLs for the PGlite worker.
#   - `style-src 'unsafe-inline'` is required by Tailwind v4's CSS-in-JS
#     output + Vite-injected style tags. The arms race for nonces in a
#     static SPA bundle is not worth fighting today; revisit if/when we
#     adopt a CSP-strict bundler workflow.
#   - `connect-src` is the RULE 1 enforcement surface: only our two
#     self-hosted backends + Google Fonts. *.supabase.co is conspicuously
#     absent and that is the point.
#   - `frame-ancestors 'none'` defends against clickjacking; supersedes
#     the legacy `X-Frame-Options: DENY` header on modern browsers.
#
# Header inheritance pitfall:
#   nginx `add_header` directives at the server level do NOT inherit into
#   a location block that has its OWN `add_header`. The set must be
#   repeated in every location that adds anything. Hence the duplication.
#
# Mirrors packages/example-app/nginx.conf in the sibling latest-data repo,
# extended with the standard security-header set.

# CSP — written once as a map so the same string can be reused in every
# location block without ambiguity.
map $sent_http_x_csp_placeholder $hotseaters_csp {
  default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://hotbase.prometheusags.ai https://electricsql.prometheusags.ai wss://hotbase.prometheusags.ai wss://electricsql.prometheusags.ai; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ── Cross-origin isolation (PGlite SharedArrayBuffer / OPFS) ──────────
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  # ── Standard web security headers ─────────────────────────────────────
  # HSTS: 1 year, includeSubDomains, preload-eligible.
  # The Gateway already redirects http→https; HSTS pins it browser-side.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
  add_header Content-Security-Policy $hotseaters_csp always;

  # ── Manual fragments — compiled MDX served as HTML ────────────────────
  location /manual/ {
    expires 5m;
    add_header Cache-Control "public, must-revalidate";
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy $hotseaters_csp always;
    try_files $uri $uri/ /index.html;
  }

  # ── Long-cache fingerprinted assets ───────────────────────────────────
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $hotseaters_csp always;
  }

  # ── Service worker — never cache stale ────────────────────────────────
  location = /sw.js {
    expires off;
    add_header Cache-Control "no-cache";
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $hotseaters_csp always;
  }

  # ── PWA manifest ──────────────────────────────────────────────────────
  location = /manifest.webmanifest {
    types { } default_type "application/manifest+json";
    expires 1h;
    add_header Cache-Control "public, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  }

  # ── SPA fallback ──────────────────────────────────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ── Health endpoint (kubernetes probes) ───────────────────────────────
  # No security headers — probes don't care; logs off to reduce noise.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
