# nginx config for the hotseaters-ultimate static bundle.
#
# Two responsibilities:
#  1. SPA fallback — every non-asset path serves index.html so client-side
#     routing (react-router-dom v7) works on deep links / refresh.
#  2. Cross-origin isolation — PGlite uses SharedArrayBuffer / OPFS, which the
#     browser only enables when the document is cross-origin isolated. The
#     COOP/COEP headers below provide that at runtime (the Vite dev server
#     sets the same headers via vite.config.ts).
#
# Mirrors packages/example-app/nginx.conf in the sibling latest-data repo.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cross-origin isolation for PGlite (SharedArrayBuffer / OPFS).
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  # Manual fragments — compiled MDX served as HTML.
  location /manual/ {
    expires 5m;
    add_header Cache-Control "public, must-revalidate";
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    try_files $uri $uri/ /index.html;
  }

  # Long-cache fingerprinted assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
  }

  # The service worker must never be cached stale.
  location = /sw.js {
    expires off;
    add_header Cache-Control "no-cache";
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
  }

  # PWA manifest is JSON; serve with correct MIME and short cache.
  location = /manifest.webmanifest {
    types { } default_type "application/manifest+json";
    expires 1h;
    add_header Cache-Control "public, must-revalidate";
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Health endpoint (kubernetes probes).
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
