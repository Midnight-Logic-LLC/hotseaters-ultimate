[package]
name = "hotseaters-ultimate"
version = "0.0.1"
description = "HotSeaters — trial consulting management. Local-first PGlite + Electric. Self-hosted Supabase only."
authors = ["Prometheus AGS"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "hotseaters_ultimate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Mobile targets (Tauri 2)
[target."cfg(any(target_os = \"ios\", target_os = \"android\"))".dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
