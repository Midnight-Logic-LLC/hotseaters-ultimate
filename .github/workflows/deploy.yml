# Deploy hotseaters-ultimate to the prometheus GKE cluster.
#
# Mirrors latest-data's .github/workflows/deploy.yml — same registry, same
# concurrency model, same tag-bump pattern. Web build only (nginx + Vite
# static bundle). The Tauri mobile workflow is separate (tauri-mobile.yml).
#
# On every push to main: build & push a linux/amd64 web image to GCP
# Artifact Registry, then open a tag-bump commit on the latest-data repo
# so ArgoCD picks up the new tag and rolls out the cluster.
#
# Required repository secrets:
#                               (no container.developer needed — we only
#                               push images; the cross-repo PR handles
#                               kustomization updates without kubectl)
#   LATEST_DATA_DEPLOY_KEY      SSH deploy key with write access on
#                               Midnight-Logic-LLC/hotseaters-data-migration-system
#                               (used to push the tag-bump commit there)
#   ENTITY_MGMT_DEPLOY_KEY      SSH deploy key (read-only) on
#                               Prometheus-AGS/prometheus-entity-management
#   VITE_SUPABASE_URL           https://hotbase.prometheusags.ai
#   VITE_SUPABASE_ANON_KEY      from latest-data's hotseaters-secrets ANON_KEY
#   VITE_ELECTRIC_URL           https://electricsql.prometheusags.ai
#
# Self-hosted Supabase only (RULE 1) — VITE_SUPABASE_URL must NEVER
# match *.supabase.co. The Vite config enforces this at build time.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deploys — two pushes never race the cross-repo tag-bump.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  ACR: prometheusagsacr.azurecr.io
  ACR_NAME: prometheusagsacr
  AKS_RG: prometheus-rg
  IMAGE_NAME: hotseaters-ultimate
  LATEST_DATA_REPO: Midnight-Logic-LLC/hotseaters-data-migration-system
  OVERLAY_FILE: k8s/overlays/prometheus/app/kustomization.yaml

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      # --- self-hosted guard rail ----------------------------------------
      # Bail before docker auth if someone tries to ship a Supabase Cloud
      # build by accident. Defence in depth — vite.config.ts also enforces.
      - name: Refuse Supabase Cloud URLs (RULE 1)
        run: |
          set -euo pipefail
          if [[ "${{ secrets.VITE_SUPABASE_URL }}" =~ \.supabase\.co ]]; then
            echo "::error::VITE_SUPABASE_URL points at Supabase Cloud — self-hosted only." >&2
            exit 1
          fi
          if [[ -z "${{ secrets.VITE_SUPABASE_URL }}" || -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" || -z "${{ secrets.VITE_ELECTRIC_URL }}" || -z "${{ secrets.VITE_ELECTRIC_SECRET }}" ]]; then
            echo "::error::Missing VITE_* secret(s); cannot build." >&2
            exit 1
          fi

      # --- entity-mgmt submodule ----------------------------------------
      # The docker build uses dockerize-deps.mjs to rewrite workspace:* →
      # ^2.0.0 and pulls from npm, so no submodule is strictly needed inside
      # the Docker build context. We still init it here so the workspace is
      # consistent for any pre-build scripts (e.g. gen:pglite-schema:check).
      - name: Init entity-mgmt submodule
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.ENTITY_MGMT_DEPLOY_KEY }}" > ~/.ssh/entity_mgmt_key
          chmod 600 ~/.ssh/entity_mgmt_key
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config submodule.packages/prometheus-entity-management.url \
            git@github.com:Prometheus-AGS/prometheus-entity-management.git
          git -c core.sshCommand="ssh -i ~/.ssh/entity_mgmt_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            submodule update --init --force --depth=1 \
            packages/prometheus-entity-management

      # --- image tag = short commit SHA ----------------------------------
      - name: Compute image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # --- GCP auth + docker login ---------------------------------------
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}


      - name: ACR login
        run: az acr login --name prometheusagsacr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- build & push: hotseaters-ultimate (web image) -----------------
      # platforms: linux/amd64 only. Single-arch by design — GKE node pool is
      # x86_64. The Dockerfile runs dockerize-deps.mjs to rewrite the
      # workspace:* dep to ^2.0.0, then installs from npm. No vendor dir.
      - name: Build & push hotseaters-ultimate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_ELECTRIC_URL=${{ secrets.VITE_ELECTRIC_URL }}
            VITE_ELECTRIC_SECRET=${{ secrets.VITE_ELECTRIC_SECRET }}
            VITE_APP_NAME=HotSeaters
            VITE_APP_VERSION=${{ steps.tag.outputs.sha }}
          tags: |
            prometheusagsacr.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.sha }}
            prometheusagsacr.azurecr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- cross-repo tag bump (latest-data overlay) ---------------------
      # Pattern mirrors latest-data's own bump-and-push step, but here we
      # clone latest-data, edit the overlay, and push back. ArgoCD's
      # auto-sync on latest-data then rolls the cluster.
      #
      # AUTHENTICATION: we authenticate via a per-repo SSH deploy key
      # registered on latest-data with write access. Stored as
      # `LATEST_DATA_DEPLOY_KEY` in this repo's secrets. This limits blast
      # radius to a single repo.
      - name: Set up SSH deploy key for latest-data
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LATEST_DATA_DEPLOY_KEY }}

      # actions/checkout@v4 with path: fails with ENOENT when the git index
      # still has the submodule entry from the previous step. Remove any stale
      # latest-data path and reset the git index so the checkout can mkdir.
      - name: Clean stale latest-data path
        run: |
          rm -rf latest-data
          git clean -ffdx latest-data 2>/dev/null || true

      - name: Checkout latest-data
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LATEST_DATA_REPO }}
          ssh-key: ${{ secrets.LATEST_DATA_DEPLOY_KEY }}
          path: latest-data
          persist-credentials: true

      - name: Bump hotseaters-ultimate tag in latest-data overlay
        working-directory: latest-data
        env:
          NEW_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          REG="prometheusagsacr.azurecr.io"
          cd "$(dirname "${OVERLAY_FILE}")"
          kustomize edit set image \
            "hotseaters/hotseaters-ultimate=${REG}/${IMAGE_NAME}:${NEW_SHA}"
          cd -

      - name: Commit tag bump
        working-directory: latest-data
        env:
          NEW_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- "${OVERLAY_FILE}"; then
            echo "No image-tag change to commit on latest-data."
            exit 0
          fi
          git add "${OVERLAY_FILE}"
          git commit -m "ci(hotseaters-ultimate): deploy ${NEW_SHA} [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "tag bump pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected — rebasing on origin/main (attempt ${attempt})"
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
          echo "::error::could not push tag bump after 5 attempts" >&2
          exit 1

      - name: Deploy summary
        env:
          NEW_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          {
            echo "## hotseaters-ultimate deploy"
            echo ""
            echo "**Image:** \`prometheusagsacr.azurecr.io/${IMAGE_NAME}:${NEW_SHA}\`"
            echo ""
            echo "Bumped tag on \`${LATEST_DATA_REPO}\`:"
            echo "  \`${OVERLAY_FILE}\`"
            echo ""
            echo "ArgoCD will roll the cluster automatically."
          } >> "$GITHUB_STEP_SUMMARY"
