name: tauri-mobile

on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/tauri-mobile.yml'
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'src/**'

jobs:
  ios-build:
    name: iOS (aarch64-apple-ios-sim, no signing)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust (stable + iOS sim target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Frontend build
        run: pnpm build

      # NOTE: this assumes `tauri ios init` has been run once and the gen/
      # output is regenerated in CI. For a fully fresh CI run, the operator
      # must check in a minimal seed under gen/ or have the init step here.
      # See docs/RUNBOOKS-TAURI.md for the bootstrap procedure.
      - name: Tauri iOS build (compile only, no signing)
        env:
          CI: 'true'
        run: |
          pnpm tauri ios build \
            --target aarch64-apple-ios-sim \
            --debug

  android-build:
    name: Android (aarch64-linux-android, no signing)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ANDROID_NDK_VERSION: '26.3.11579264'
      ANDROID_PLATFORM: '34'
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust (stable + Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Frontend build
        run: pnpm build

      - name: Tauri Android build (APK, debug, no signing)
        env:
          CI: 'true'
        run: |
          pnpm tauri android build \
            --apk \
            --target aarch64 \
            --debug
