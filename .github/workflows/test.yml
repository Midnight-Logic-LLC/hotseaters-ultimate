# hotseaters-ultimate CI test pipeline.
#
# Hard Constraints:
#   - Self-hosted Supabase only — never *.supabase.co.
#   - HotSeatersMVP is the bible.
#
# Pipeline: install → typecheck → lint → vitest → playwright e2e → cucumber
# → visual-parity (compare only) → pgTAP.

name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      HU_PORT: '5174'
      VITE_BASE_URL: 'http://localhost:5174'
      VITE_SUPABASE_URL: 'http://localhost:8000'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Load BOTH deploy keys into ssh-agent so the latest-data checkout
      # AND its prometheus-entity-management submodule can both be cloned.
      # actions/checkout's `ssh-key:` parameter only supports one key; for
      # cross-repo submodule auth we have to use ssh-agent + `ssh: true`
      # mode on the checkout, which then picks up any loaded identity.
      - name: Load SSH deploy keys (latest-data + entity-mgmt submodule)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.LATEST_DATA_DEPLOY_KEY }}
            ${{ secrets.ENTITY_MGMT_DEPLOY_KEY }}

      # Checkout latest-data into a subdirectory of the workspace (NOT `../`,
      # which actions/checkout rejects for security). The migrations step
      # below references it via the in-workspace path. Includes the
      # prometheus-entity-management submodule so we can rebuild + re-vendor
      # the entity-mgmt library in the next step — fully automatic, no
      # human re-vendoring needed.
      - name: Checkout latest-data (in-workspace, without submodules)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/hotseaters-data-migration-system
          ssh-key: ${{ secrets.LATEST_DATA_DEPLOY_KEY }}
          path: latest-data
          submodules: false

      # The submodule's `.gitmodules` URL is https://github.com/... which
      # bypasses our ssh-agent. Rewrite to SSH so the clone authenticates
      # via the ENTITY_MGMT_DEPLOY_KEY identity loaded in ssh-agent.
      - name: Init entity-mgmt submodule via SSH
        working-directory: latest-data
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git config submodule.packages/prometheus-entity-management.url \
            git@github.com:Prometheus-AGS/prometheus-entity-management.git
          git -c core.sshCommand="ssh -o StrictHostKeyChecking=accept-new" \
            submodule update --init --force --depth=1 \
            packages/prometheus-entity-management
          ls -la packages/prometheus-entity-management/ | head -5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the entity-mgmt library from latest-data's submodule source,
      # then copy the freshly-built dist + package.json into
      # vendor/prometheus-entity-management/. Replaces whatever was
      # committed in this repo at HEAD — CI is canonical on every push.
      - name: Rebuild + vendor @prometheus-ags/prometheus-entity-management
        run: |
          set -euo pipefail
          SUBMODULE=latest-data/packages/prometheus-entity-management
          VENDOR_DIR=vendor/prometheus-entity-management
          echo "Building entity-mgmt from ${SUBMODULE}..."
          pushd "${SUBMODULE}"
          # The submodule may or may not be part of latest-data's pnpm
          # workspace; install + build standalone to be safe.
          pnpm install --frozen-lockfile || pnpm install
          pnpm build
          popd
          echo "Re-vendoring dist/ + package.json into ${VENDOR_DIR}..."
          rm -rf "${VENDOR_DIR}/dist"
          mkdir -p "${VENDOR_DIR}"
          cp -R "${SUBMODULE}/dist" "${VENDOR_DIR}/dist"
          cp    "${SUBMODULE}/package.json" "${VENDOR_DIR}/package.json"
          echo "Vendored files:"
          ls -la "${VENDOR_DIR}/dist" | head -10
          # Re-run pnpm install so workspace symlinks pick up the fresh
          # vendor dir (otherwise consumers see the stale committed copy).
          pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit + integration tests (vitest)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: E2E (Playwright)
        run: pnpm test:e2e

      - name: BDD journeys (Cucumber)
        run: pnpm test:e2e:cucumber

      - name: Visual parity (compare only)
        run: pnpm test:visual-parity

      - name: Apply Supabase migrations for pgTAP
        run: |
          PGPASSWORD=postgres psql -h localhost -U supabase_admin -d postgres \
            -c "CREATE EXTENSION IF NOT EXISTS pgtap;"
          for f in latest-data/supabase/migrations/*.sql; do
            echo "Applying $f"
            PGPASSWORD=postgres psql -h localhost -U supabase_admin -d postgres -f "$f"
          done

      - name: Install pgTAP runner
        run: |
          sudo apt-get update
          sudo apt-get install -y libtap-parser-sourcehandler-pgtap-perl postgresql-client

      - name: pgTAP suite
        env:
          DB_URL: postgres://supabase_admin:postgres@localhost:5432/postgres
        run: pnpm test:db

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            tests/e2e/.artifacts
          retention-days: 14

      - name: Upload visual-parity artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-parity-diff
          path: tests/visual-parity/.artifacts
          retention-days: 14
